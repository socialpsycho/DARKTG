name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name darktg

      - name: Apply DARKTG app icon and branding
        run: bash tool/setup_android_brand.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        env:
          DARKTG_API_ID: ${{ secrets.DARKTG_API_ID }}
          DARKTG_API_HASH: ${{ secrets.DARKTG_API_HASH }}
        run: |
          flutter build apk --debug \
            --dart-define=DARKTG_API_ID="$DARKTG_API_ID" \
            --dart-define=DARKTG_API_HASH="$DARKTG_API_HASH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: darktg-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
