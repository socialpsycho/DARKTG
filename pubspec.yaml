name: darktg
description: DARKTG — an experimental Telegram client interface.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  handy_tdlib_next: ^2.3.16
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  cached_network_image: ^3.4.1
  record: ^6.1.2
  file_picker: ^10.3.7
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
